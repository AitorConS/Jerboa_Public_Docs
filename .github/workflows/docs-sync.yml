name: docs-sync
concurrency:
  group: docs-sync
  cancel-in-progress: false
on:
  # The engine repository cannot start a workflow here without a credential
  # of its own, so this one asks every 15 minutes. A run that finds nothing
  # new stops after the comparison, before installing anything.
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
# Two jobs, so that no third-party code runs where a token can push to main:
# - sync compares the engine's docs with the snapshot here and, when they
#   differ, records the SHA-256 of the new snapshot before anything is
#   installed, then installs (without dependency scripts), builds and checks
#   the anchors, and uploads the snapshot. Its token can only read.
# - publish installs and runs nothing from the repository: it checks the
#   uploaded snapshot against the hash recorded before the install (so a
#   snapshot changed later in sync, by the build or anything it installed,
#   is refused), puts it in place of src/pages, src/data/docs.json,
#   src/data/lastmod.json and the redirects in vercel.json on the same
#   commit and pushes to main. Only the redirects of vercel.json may change:
#   they list the page slugs, and the rest of that file is checked unchanged.
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      snapshot: ${{ steps.diff.outputs.snapshot }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: AitorConS/jerboa
          path: engine
          persist-credentials: false
          sparse-checkout: |
            /docs/
            /kernel/VERSION
            /VERSION.md
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # The sync script uses only Node's standard library, so the comparison
      # needs no install. The snapshot's hash covers every file under
      # src/pages, src/data/docs.json, src/data/lastmod.json and vercel.json,
      # with their paths.
      - name: Compare with the engine's docs
        id: diff
        run: |
          JERBOA_SOURCE=engine node scripts/sync-docs.mjs
          git add -A -- src/pages src/data/docs.json src/data/lastmod.json vercel.json
          if git diff --cached --quiet; then
            echo "The site already matches the engine's docs."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git diff --cached --stat
            echo "changed=true" >> "$GITHUB_OUTPUT"
            snapshot=$(find src/pages src/data/docs.json src/data/lastmod.json vercel.json -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
            echo "Snapshot: $snapshot"
            echo "snapshot=$snapshot" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.diff.outputs.changed == 'true'
      - run: pnpm install --frozen-lockfile --ignore-scripts
        if: steps.diff.outputs.changed == 'true'
      # The snapshot is published only if the site builds from it and every
      # link in it lands on a heading that exists.
      - run: JERBOA_SOURCE=engine pnpm run build
        if: steps.diff.outputs.changed == 'true'
      - run: pnpm run docs:anchors
        if: steps.diff.outputs.changed == 'true'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.diff.outputs.changed == 'true'
        with:
          name: docs-snapshot
          path: |
            src/pages
            src/data/docs.json
            src/data/lastmod.json
            vercel.json
          if-no-files-found: error
          retention-days: 1
  # Straight to main: the pages are a copy of what is already reviewed and
  # merged in the engine repository. A pull request here waited for an
  # approval nobody was asked for, and the site fell behind the releases.
  publish:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # The commit sync compared against (the default): if main has moved
      # since, the push below fails, as it did when this was one job.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-snapshot
          path: ${{ runner.temp }}/docs-snapshot
      # The artifact keeps the repository paths: src/pages, src/data/*.json and vercel.json.
      - name: Check the snapshot against the recorded hash
        working-directory: ${{ runner.temp }}/docs-snapshot
        env:
          EXPECTED: ${{ needs.sync.outputs.snapshot }}
        run: |
          [[ "$EXPECTED" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::No snapshot hash from sync"; exit 1; }
          extra=$(find . -type f ! -path './src/pages/*' ! -path './src/data/docs.json' ! -path './src/data/lastmod.json' ! -path './vercel.json')
          if [ -n "$extra" ]; then
            echo "::error::The artifact holds files outside the snapshot: $extra"
            exit 1
          fi
          actual=$(find src/pages src/data/docs.json src/data/lastmod.json vercel.json -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          if [ "$actual" != "$EXPECTED" ]; then
            echo "::error::The snapshot ($actual) is not the one sync compared ($EXPECTED)"
            exit 1
          fi
      - name: Publish the snapshot
        env:
          SNAPSHOT: ${{ runner.temp }}/docs-snapshot
        run: |
          # Sync may only rewrite the redirects: the build and install
          # commands in vercel.json must stay what main has.
          if [ "$(jq -S 'del(.redirects)' "$SNAPSHOT/vercel.json")" != "$(jq -S 'del(.redirects)' vercel.json)" ]; then
            echo "::error::The snapshot's vercel.json changes more than its redirects"
            exit 1
          fi
          rm -rf src/pages src/data/docs.json src/data/lastmod.json
          mkdir -p src/data
          cp -R -- "$SNAPSHOT/src/pages" src/pages
          cp -- "$SNAPSHOT/src/data/docs.json" src/data/docs.json
          cp -- "$SNAPSHOT/src/data/lastmod.json" src/data/lastmod.json
          cp -- "$SNAPSHOT/vercel.json" vercel.json
          git add -A -- src/pages src/data/docs.json src/data/lastmod.json vercel.json
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'docs: sync from jerboa engine'
          git push origin HEAD:main
