name: docs-sync
concurrency:
  group: docs-sync
  cancel-in-progress: false
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: AitorConS/jerboa
          path: engine
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: JERBOA_SOURCE=engine pnpm run docs:sync
      # The snapshot is published only if the site builds from it and every
      # link in it lands on a heading that exists.
      - run: JERBOA_SOURCE=engine pnpm run build
      - run: pnpm run docs:anchors
      # Straight to main: the pages are a copy of what is already reviewed and
      # merged in the engine repository. A pull request here waited for an
      # approval nobody was asked for, and the site fell behind the releases.
      - name: Publish the snapshot
        run: |
          git add -A -- src/pages src/data/docs.json
          if git diff --cached --quiet; then
            echo "The site already matches the engine's docs."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'docs: sync from jerboa engine'
          git push origin HEAD:main
